<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Workout Logger</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Workout Logger</h1>

      <div class="training-rule">
        <div>前回より、１回でも多く、１kgでも重く</div>
        <div>10回出来たら次ある重さに</div>
      </div>
    </header>

    <nav class="tabs" aria-label="画面切り替え">
      <button type="button" class="tab-button active" data-tab="log">
        記録
      </button>
      <button type="button" class="tab-button" data-tab="calendar">
        カレンダー
      </button>
    </nav>

    <section id="logTab" class="tab-panel active">
      <section class="card">
        <h2>今日の設定</h2>

        <label class="field">
          <span>日付</span>
          <input type="date" id="workoutDate" />
        </label>

        <label class="field">
          <span>部位</span>
          <select id="bodyPart">
            <option value="">選択してください</option>
            <option value="胸">胸</option>
            <option value="背中">背中</option>
            <option value="脚">脚</option>
            <option value="腕">腕</option>
            <option value="肩">肩</option>
            <option value="腹">腹</option>
            <option value="全身">全身</option>
          </select>
        </label>

        <label class="field">
          <span>全体メモ</span>
          <textarea id="sessionMemo" rows="2" placeholder="例：体調、混雑、フォーム感覚など"></textarea>
        </label>

        <button id="loadExercisesButton" class="button primary">
          種目を読み込む
        </button>
      </section>

      <section class="card">
        <h2>今日やる種目を選ぶ</h2>

        <div id="statusMessage" class="status-message">
          部位を選んで「種目を読み込む」を押してください。
        </div>

        <div id="exercisePicker" class="exercise-picker"></div>

        <button id="addSelectedExercisesButton" class="button secondary" disabled>
          選んだ種目を追加
        </button>
      </section>

      <section class="card">
        <h2>今回のトレーニング</h2>

        <div id="exerciseList" class="exercise-list"></div>
      </section>

      <section class="card submit-card">
        <button id="submitButton" class="button submit" disabled>
          Notionに保存
        </button>

        <div id="submitMessage" class="submit-message"></div>
      </section>
    </section>

    <section id="calendarTab" class="tab-panel">
      <section class="card calendar-card">
        <div class="calendar-header">
          <button type="button" id="prevMonthButton" class="calendar-nav-button">
            前月
          </button>

          <div>
            <h2 id="calendarTitle">カレンダー</h2>
            <div id="calendarStatus" class="calendar-status">
              読み込み前
            </div>
          </div>

          <button type="button" id="nextMonthButton" class="calendar-nav-button">
            次月
          </button>
        </div>

        <div class="calendar-actions">
          <button type="button" id="todayMonthButton" class="button calendar-today-button">
            今月に戻る
          </button>

          <button type="button" id="togglePlanFormButton" class="button calendar-plan-toggle-button">
            予定を追加
          </button>
        </div>

        <div id="planForm" class="plan-form hidden">
          <h3>予定を追加</h3>

          <label class="field">
            <span>予定日</span>
            <input type="date" id="planDate" />
          </label>

          <label class="field">
            <span>部位</span>
            <select id="planBodyPart">
              <option value="">選択してください</option>
              <option value="胸">胸</option>
              <option value="背中">背中</option>
              <option value="脚">脚</option>
              <option value="腕">腕</option>
              <option value="肩">肩</option>
              <option value="腹">腹</option>
              <option value="全身">全身</option>
            </select>
          </label>

          <label class="field">
            <span>予定メモ</span>
            <textarea id="planMemo" rows="2" placeholder="例：胸の日、ベンチ重めなど"></textarea>
          </label>

          <button type="button" id="savePlanButton" class="button save-plan-button">
            予定を保存
          </button>

          <div id="planMessage" class="plan-message"></div>
        </div>

        <div class="calendar-weekdays" aria-hidden="true">
          <div>月</div>
          <div>火</div>
          <div>水</div>
          <div>木</div>
          <div>金</div>
          <div>土</div>
          <div>日</div>
        </div>

        <div id="calendarGrid" class="calendar-grid"></div>

        <div class="calendar-legend">
          <span><span class="legend-sample actual-sample"></span>実績</span>
          <span><span class="legend-sample plan-sample"></span>予定</span>
        </div>

        <div class="calendar-legend body-legend">
          <span><span class="legend-dot body-chest"></span>胸</span>
          <span><span class="legend-dot body-back"></span>背</span>
          <span><span class="legend-dot body-legs"></span>脚</span>
          <span><span class="legend-dot body-arms"></span>腕</span>
          <span><span class="legend-dot body-shoulders"></span>肩</span>
          <span><span class="legend-dot body-abs"></span>腹</span>
          <span><span class="legend-dot body-full"></span>全</span>
        </div>
      </section>
    </section>
  </main>

  <template id="pickerItemTemplate">
    <label class="picker-item">
      <input type="checkbox" class="picker-checkbox" />
      <span class="picker-name"></span>
      <span class="picker-category"></span>
    </label>
  </template>

  <template id="exerciseTemplate">
    <article class="exercise-card">
      <div class="exercise-header">
        <div>
          <h3 class="exercise-name"></h3>
          <p class="exercise-category"></p>
        </div>

        <div class="exercise-actions">
          <button type="button" class="move-up-button">↑</button>
          <button type="button" class="move-down-button">↓</button>
          <button type="button" class="remove-exercise-button">削除</button>
        </div>
      </div>

      <div class="last-workout">
        <h4>直近記録</h4>
        <div class="last-workout-content"></div>
      </div>

      <div class="current-workout">
        <h4>今回</h4>

        <div class="sets-container"></div>

        <button type="button" class="button small add-set-button">
          セット追加
        </button>
      </div>

      <label class="field">
        <span>種目メモ</span>
        <textarea class="exercise-memo" rows="2" placeholder="フォーム、違和感、次回メモなど"></textarea>
      </label>
    </article>
  </template>

  <template id="setTemplate">
    <div class="set-row">
      <div class="set-number"></div>

      <label>
        <span>kg</span>
        <input type="number" class="set-weight" inputmode="decimal" step="0.5" min="0" />
      </label>

      <label>
        <span>回</span>
        <input type="number" class="set-reps" inputmode="numeric" step="1" min="0" />
      </label>

      <div class="result-toggle" role="group" aria-label="成功失敗">
        <button type="button" class="result-button success active" data-success="true">
          GOOD
        </button>
        <button type="button" class="result-button fail" data-success="false">
          FAIL
        </button>
      </div>

      <button type="button" class="remove-set-button" aria-label="セット削除">
        ×
      </button>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
