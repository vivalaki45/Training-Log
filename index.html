<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#111111"
  />

  <title>Workout Logger</title>

  <link
    rel="stylesheet"
    href="style.css"
  />
</head>

<body>
  <main class="app">
    <header class="app-header">
      <h1>Workout Logger</h1>

      <div class="training-rule">
        <div>
          前回より、１回でも多く、１kgでも重く
        </div>

        <div>
          10回出来たら次ある重さに
        </div>
      </div>
    </header>

    <nav
      class="tabs"
      aria-label="画面切り替え"
    >
      <button
        type="button"
        class="tab-button active"
        data-tab="log"
      >
        記録
      </button>

      <button
        type="button"
        class="tab-button"
        data-tab="calendar"
      >
        カレンダー
      </button>
    </nav>

    <!-- トレーニング記録 -->
    <section
      id="logTab"
      class="tab-panel active"
    >
      <!-- 今日の設定 -->
      <section class="card">
        <h2>今日の設定</h2>

        <label class="field date-field">
          <span>日付</span>

          <div class="date-input-wrap">
            <span
              class="date-icon"
              aria-hidden="true"
            >
              📅
            </span>

            <input
              type="date"
              id="workoutDate"
            />
          </div>
        </label>

        <label class="field">
          <span>部位</span>

          <select id="bodyPart">
            <option value="">
              選択してください
            </option>

            <option value="胸">
              胸
            </option>

            <option value="背中">
              背中
            </option>

            <option value="脚">
              脚
            </option>

            <option value="腕">
              腕
            </option>

            <option value="肩">
              肩
            </option>

            <option value="腹">
              腹
            </option>

            <option value="全身">
              全身
            </option>
          </select>
        </label>

        <label class="field">
          <span>全体メモ</span>

          <textarea
            id="sessionMemo"
            rows="2"
            placeholder="例：体調、混雑、フォーム感覚など"
          ></textarea>
        </label>

        <button
          type="button"
          id="loadExercisesButton"
          class="button primary"
        >
          種目を読み込む
        </button>
      </section>

      <!-- 種目選択 -->
      <section class="card">
        <h2>今日やる種目を選ぶ</h2>

        <div
          id="statusMessage"
          class="status-message"
        >
          部位を選んで「種目を読み込む」を押してください。
        </div>

        <div
          id="exercisePicker"
          class="exercise-picker"
        ></div>

        <!-- 種目マスター操作 -->
        <div class="exercise-master-actions">
          <button
            type="button"
            id="createExerciseButton"
            class="button small"
          >
            ＋ 新しい種目
          </button>

          <button
            type="button"
            id="archiveExercisesButton"
            class="button small danger-button"
          >
            選択した種目を削除
          </button>
        </div>

        <button
          type="button"
          id="addSelectedExercisesButton"
          class="button secondary"
          disabled
        >
          選んだ種目を追加
        </button>
      </section>

      <!-- 今回のトレーニング -->
      <section class="card">
        <h2>今回のトレーニング</h2>

        <div
          id="exerciseList"
          class="exercise-list"
        ></div>
      </section>

      <!-- 保存 -->
      <section class="card submit-card">
        <button
          type="button"
          id="submitButton"
          class="button submit"
          disabled
        >
          Notionに保存
        </button>

        <div
          id="submitMessage"
          class="submit-message"
        ></div>
      </section>
    </section>

    <!-- カレンダー -->
    <section
      id="calendarTab"
      class="tab-panel"
    >
      <section class="card calendar-card">
        <div class="calendar-header">
          <button
            type="button"
            id="prevMonthButton"
            class="calendar-nav-button"
          >
            前月
          </button>

          <div>
            <h2 id="calendarTitle">
              カレンダー
            </h2>

            <div
              id="calendarStatus"
              class="calendar-status"
            >
              読み込み前
            </div>
          </div>

          <button
            type="button"
            id="nextMonthButton"
            class="calendar-nav-button"
          >
            次月
          </button>
        </div>

        <div class="calendar-actions">
          <button
            type="button"
            id="todayMonthButton"
            class="button calendar-today-button"
          >
            今月に戻る
          </button>

          <button
            type="button"
            id="togglePlanFormButton"
            class="button calendar-plan-toggle-button"
          >
            予定を追加
          </button>
        </div>

        <!-- 予定追加フォーム -->
        <div
          id="planForm"
          class="plan-form hidden"
        >
          <h3>予定を追加</h3>

          <label class="field">
            <span>予定日</span>

            <input
              type="date"
              id="planDate"
            />
          </label>

          <label class="field">
            <span>部位</span>

            <select id="planBodyPart">
              <option value="">
                選択してください
              </option>

              <option value="胸">
                胸
              </option>

              <option value="背中">
                背中
              </option>

              <option value="脚">
                脚
              </option>

              <option value="腕">
                腕
              </option>

              <option value="肩">
                肩
              </option>

              <option value="腹">
                腹
              </option>

              <option value="全身">
                全身
              </option>
            </select>
          </label>

          <label class="field">
            <span>予定メモ</span>

            <textarea
              id="planMemo"
              rows="2"
              placeholder="例：胸の日、ベンチ重めなど"
            ></textarea>
          </label>

          <button
            type="button"
            id="savePlanButton"
            class="button save-plan-button"
          >
            予定を保存
          </button>

          <div
            id="planMessage"
            class="plan-message"
          ></div>
        </div>

        <div
          class="calendar-weekdays"
          aria-hidden="true"
        >
          <div>月</div>
          <div>火</div>
          <div>水</div>
          <div>木</div>
          <div>金</div>
          <div>土</div>
          <div>日</div>
        </div>

        <div
          id="calendarGrid"
          class="calendar-grid"
        ></div>

        <div class="calendar-legend">
          <span>
            <i
              class="legend-sample actual-sample"
            ></i>

            実績
          </span>

          <span>
            <i
              class="legend-sample plan-sample"
            ></i>

            予定
          </span>
        </div>
      </section>
    </section>
  </main>

  <!-- 種目選択テンプレート -->
  <template id="pickerItemTemplate">
    <label class="picker-item">
      <input
        type="checkbox"
        class="picker-checkbox"
      />

      <span class="picker-order"></span>

      <span class="picker-text">
        <span class="picker-name"></span>

        <span class="picker-category"></span>
      </span>
    </label>
  </template>

  <!-- 種目カード -->
  <template id="exerciseTemplate">
    <article class="exercise-card">
      <div class="exercise-header">
        <div>
          <h3 class="exercise-name"></h3>

          <p class="exercise-category"></p>
        </div>

        <div class="exercise-actions">
          <button
            type="button"
            class="move-up-button"
            aria-label="上へ移動"
          >
            ↑
          </button>

          <button
            type="button"
            class="move-down-button"
            aria-label="下へ移動"
          >
            ↓
          </button>

          <button
            type="button"
            class="remove-exercise-button"
          >
            削除
          </button>
        </div>
      </div>

      <!-- 前回記録 -->
      <div class="last-workout">
        <h4>直近記録・前回メモ</h4>

        <div class="last-workout-content"></div>
      </div>

      <!-- 今回記録 -->
      <div class="current-workout">
        <h4>今回</h4>

        <div class="sets-container"></div>

        <button
          type="button"
          class="button small add-set-button"
        >
          セット追加
        </button>
      </div>

      <label class="field">
        <span>種目メモ</span>

        <textarea
          class="exercise-memo"
          rows="2"
          placeholder="フォーム、違和感、次回メモなど"
        ></textarea>
      </label>
    </article>
  </template>

  <!-- 通常セット -->
  <template id="setTemplate">
    <div class="set-block">
      <div class="set-row">
        <div class="set-number"></div>

        <label>
          <span>kg</span>

          <input
            type="number"
            class="set-weight"
            inputmode="decimal"
            step="0.5"
            min="0"
          />
        </label>

        <label>
          <span>回</span>

          <input
            type="number"
            class="set-reps"
            inputmode="numeric"
            step="1"
            min="0"
          />
        </label>

        <div
          class="result-toggle"
          role="group"
          aria-label="成功失敗"
        >
          <button
            type="button"
            class="result-button success active"
            data-success="true"
          >
            GOOD
          </button>

          <button
            type="button"
            class="result-button fail"
            data-success="false"
          >
            FAIL
          </button>
        </div>

        <button
          type="button"
          class="remove-set-button"
          aria-label="セット削除"
        >
          ×
        </button>
      </div>

      <div class="subsets-container"></div>

      <button
        type="button"
        class="add-subset-button"
      >
        ＋ ダウンセット
      </button>
    </div>
  </template>

  <!-- ダウンセット -->
  <template id="subsetTemplate">
    <div class="subset-row">
      <div
        class="subset-branch"
        aria-hidden="true"
      >
        └
      </div>

      <div class="subset-main">
        <div class="subset-heading">
          <span class="subset-badge">
            ダウンセット
          </span>

          <span class="subset-number"></span>
        </div>

        <div class="subset-inputs">
          <label>
            <span>kg</span>

            <input
              type="number"
              class="subset-weight"
              inputmode="decimal"
              step="0.5"
              min="0"
            />
          </label>

          <label>
            <span>回</span>

            <input
              type="number"
              class="subset-reps"
              inputmode="numeric"
              step="1"
              min="0"
            />
          </label>

          <button
            type="button"
            class="remove-subset-button"
            aria-label="ダウンセット削除"
          >
            ×
          </button>
        </div>
      </div>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
